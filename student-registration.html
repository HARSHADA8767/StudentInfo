
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - StudentInfo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <h2>StudentInfo</h2>
        <span>Student Information System</span>
    </header>

    <div class="layout">

        <aside class="sidebar">
            <h3>MAIN MENU</h3>
            <a href="index.html">Dashboard</a>
            <a href="student-registration.html" class="active">Student Registration</a>
            <a href="student-list.html">Student Listing</a>
            <a href="#">Student Profile</a>
            <a href="#">Academic Records</a>
            <a href="#">Attendance Records</a>
            <a href="#">Fee Management</a>
            <a href="#">Student Documents</a>
            <a href="#">Reports</a>
        </aside>

        <main class="content">

            <h1>Student Registration</h1>
            <p class="subtitle">Register a new student in the system.</p>

            <section class="panel">

                <h2>Personal Information</h2>

                <form id="studentForm">

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="rollNo">Roll Number *</label>
                            <input type="text" id="rollNo" required>
                        </div>

                        <div class="form-group">
                            <label for="fullName">Full Name *</label>
                            <input type="text" id="fullName" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" required>
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone"
                                   pattern="[0-9]{10}"
                                   maxlength="10" required>
                        </div>

                        <div class="form-group">
                            <label for="dob">Date of Birth *</label>
                            <input type="date" id="dob" required>
                        </div>

                        <div class="form-group">
                            <label for="gender">Gender *</label>
                            <select id="gender" required>
                                <option value="">Select Gender</option>
                                <option value="Female">Female</option>
                                <option value="Male">Male</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="department">Department *</label>
                            <select id="department" required>
                                <option value="">Select Department</option>
                                <option value="Computer Science">Computer Science</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Mechanical">Mechanical</option>
                                <option value="Civil">Civil</option>
                                <option value="Electronics">Electronics</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="course">Course *</label>
                            <select id="course" required>
                                <option value="">Select Course</option>
                                <option value="B.E.">B.E.</option>
                                <option value="B.Tech">B.Tech</option>
                                <option value="BCA">BCA</option>
                                <option value="MCA">MCA</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="year">Academic Year *</label>
                            <select id="year" required>
                                <option value="">Select Year</option>
                                <option value="First Year">First Year</option>
                                <option value="Second Year">Second Year</option>
                                <option value="Third Year">Third Year</option>
                                <option value="Final Year">Final Year</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="address">Address *</label>
                            <textarea id="address" rows="3" required></textarea>
                        </div>

                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">
                            Register Student
                        </button>

                        <button type="reset" class="btn-secondary">
                            Clear Form
                        </button>
                    </div>

                    <p id="formMessage" role="status"></p>

                </form>

            </section>

        </main>

    </div>

    
<script>
const studentForm = document.getElementById("studentForm");
const formMessage = document.getElementById("formMessage");

studentForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const student = {
        rollNo: document.getElementById("rollNo").value.trim(),
        fullName: document.getElementById("fullName").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        dob: document.getElementById("dob").value,
        gender: document.getElementById("gender").value,
        department: document.getElementById("department").value,
        course: document.getElementById("course").value,
        year: document.getElementById("year").value,
        address: document.getElementById("address").value.trim(),
        status: "Active",
        registeredAt: new Date().toISOString()
    };

    let students = JSON.parse(
        localStorage.getItem("students") || "[]"
    );

    const duplicate = students.some(function(item) {
        return item.rollNo.toLowerCase() === student.rollNo.toLowerCase();
    });

    if (duplicate) {
        formMessage.textContent =
            "Error: This Roll Number is already registered.";
        formMessage.style.color = "#dc2626";
        return;
    }

    students.push(student);

    localStorage.setItem("students", JSON.stringify(students));

    formMessage.textContent =
        "Student registered successfully!";
    formMessage.style.color = "#047857";

    studentForm.reset();
});
</script>
</body>
</html>
